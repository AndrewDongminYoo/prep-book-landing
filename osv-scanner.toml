[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@3.1.5 has no compatible patch as of 2026-11-01: the only fix is 11.0.1, whose CommonJS export is an object, while eslint-plugin-import 2.32.0, eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-react 7.37.5 call the 3.x export as a function. Reachability evidence: every minimatch call in those plugins (grep for minimatch( and _minimatch2['default'] under their lib/ directories) passes a pattern taken from ESLint rule options, which only this repository's eslint.config.mjs supplies, and the package runs only under pnpm lint; the static site output does not include it. The 10.x line is overridden to ^11.0.1 in pnpm-workspace.yaml. Approved on 2026-11-01. Re-evaluate when a 3.x patch is released or the plugins leave minimatch 3."
