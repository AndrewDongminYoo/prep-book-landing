version: "0.2"
useGitignore: true
enableGlobDot: true
ignorePaths:
  - .git
  - pnpm-lock.yaml
dictionaries:
  - en-gb
  - node
  - npm
  - typescript
  - softwareTerms
  - filetypes
  - fonts
  - prep_book_project_terms
dictionaryDefinitions:
  - name: prep_book_project_terms
    path: ./.cspell/project-terms.txt
    addWords: false
